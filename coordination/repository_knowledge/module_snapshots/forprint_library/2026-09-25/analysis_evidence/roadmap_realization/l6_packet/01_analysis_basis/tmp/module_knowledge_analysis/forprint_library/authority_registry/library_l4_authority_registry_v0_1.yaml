authority_precedence:
- rank: 1
  rule: current Blueprint global/module policy governs Library role, ownership and non-ownership
- rank: 2
  rule: current executable/data implementation sources govern what is actually implemented inside that approved boundary
- rank: 3
  rule: manually authored current machine schemas constrain their bounded surface, but code-vs-schema precedence remains explicit
    where unresolved
- rank: 4
  rule: generated projections/artifacts inherit meaning from their generator/source and never outrank it
- rank: 5
  rule: supporting docs/runbooks/fixtures explain or validate current surfaces but do not become canonical truth
- rank: 6
  rule: completion reports and ADRs are provenance/evidence, not rolling current-state authority
- rank: 7
  rule: Human Intent and roadmap are planning context and do not grant release/execution authority
- rank: 8
  rule: stale/superseded surfaces are blocked from current-state claims
