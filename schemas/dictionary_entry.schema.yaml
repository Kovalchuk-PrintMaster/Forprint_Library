$schema: https://json-schema.org/draft/2020-12/schema
title: ForPrint Dictionary Entry
type: object
required:
- id
- label_uk
- label_en
- description
- status
- aliases
- owner_module
- dictionary_group
- version
- notes
properties:
  id:
    type: string
    pattern: ^[a-z0-9_]+$
  label_uk:
    type: string
    minLength: 1
  label_en:
    type: string
    minLength: 1
  description:
    type: string
    minLength: 1
  status:
    enum:
    - active
    - draft
    - deprecated
  aliases:
    type: array
    items:
      type: string
      minLength: 1
  owner_module:
    const: forprint_library
  dictionary_group:
    type: string
    minLength: 1
  version:
    const: '0.1'
  notes:
    type: string
additionalProperties: true
